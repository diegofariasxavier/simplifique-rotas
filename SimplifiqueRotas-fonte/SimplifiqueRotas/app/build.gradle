plugins { id 'com.android.application' }
android {
    namespace 'br.com.simplifique.rotas'
    compileSdk 35
    defaultConfig {
        applicationId 'br.com.simplifique.rotas'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('ROTAS_KEYSTORE') ?: '../assinatura/rotas-release.jks')
            storePassword System.getenv('ROTAS_STORE_PASSWORD') ?: 'simplifique-rotas-local'
            keyAlias 'rotas'
            keyPassword System.getenv('ROTAS_KEY_PASSWORD') ?: 'simplifique-rotas-local'
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
